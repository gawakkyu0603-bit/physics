name: Assemble and attach frozen CAT v4 assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cat-v4
  cancel-in-progress: false

jobs:
  release-assets:
    if: github.repository == 'gawakkyu0603-bit/physics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact triggering commit from the public repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags --depth=1 origin refs/tags/cat-v4.0.0:refs/tags/cat-v4.0.0

      - name: Record the compression runtime and verify the frozen release tag
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys,zlib; print(sys.version,zlib.ZLIB_RUNTIME_VERSION)'
          python3 tools/release_cat_v4/verify_tag.py --output "${RUNNER_TEMP}/cat-v4-tag.json"

      - name: Download official dependencies and reconstruct all five exact assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_cat_v4/build_release.py \
            --download \
            --cache "${RUNNER_TEMP}/cat-v4-upstream" \
            --output "${RUNNER_TEMP}/cat-v4-assets"

      - name: Add missing assets to the existing release and verify their hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_cat_v4/publish_release.py \
            --assets "${RUNNER_TEMP}/cat-v4-assets" \
            --tag-verification "${RUNNER_TEMP}/cat-v4-tag.json"

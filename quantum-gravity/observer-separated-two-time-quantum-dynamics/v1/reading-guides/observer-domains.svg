ht="112" fill="#245edb"/><text x="45" y="256" font-size="22" fill="#245edb" font-weight="500" text-anchor="start">A: local description</text><text x="45" y="312" font-size="20" fill="#35506e" font-weight="500" text-anchor="start">Smooth crossing in</text><text x="45" y="342" font-size="20" fill="#35506e" font-weight="500" text-anchor="start">semiclassical GR</text><rect x="585" y="220" width="270" height="136" rx="12" fill="#fff" stroke="#7547bc" stroke-width="2"/><rect x="585" y="232" width="5" height="112" fill="#7547bc"/><text x="605" y="256" font-size="22" fill="#7547bc" font-weight="500" text-anchor="start">B: exterior records</text><text x="605" y="312" font-size="20" fill="#35506e" font-weight="500" text-anchor="start">Redshifted signals</text><text x="605" y="342" font-size="20" fill="#35506e" font-weight="500" text-anchor="start">and radiation</text><text x="440" y="414" font-size="19" fill="#4e6583" font-weight="500" text-anchor="middle">Schematic: different accessible records, not two observed spacetimes</text></svg>

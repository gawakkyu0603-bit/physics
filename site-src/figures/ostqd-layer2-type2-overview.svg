<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="layer2-title"><title id="layer2-title">From ensemble dynamics to contextual records</title><rect x="18" y="18" width="844" height="384" rx="14" fill="#f6f9fe" stroke="#cad9ed"/><text x="440" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#23466e">From ensemble dynamics to contextual records</text><rect x="225" y="82" width="430" height="79" rx="12" fill="#173a62"/><text x="440" y="115" text-anchor="middle" font-size="22" fill="white" font-weight="700">Layer 1: non-selective channel</text><text x="440" y="143" text-anchor="middle" font-size="17" fill="#dbeaff">Many instruments can share one channel</text><g fill="none" stroke="#6586ae" stroke-width="3"><path d="M440 161V205H160V235"/><path d="M440 205V235"/><path d="M440 205H720V235"/></g><g fill="#6586ae"><path d="M154 226L160 238L166 226Z"/><path d="M434 226L440 238L446 226Z"/><path d="M714 226L720 238L726 226Z"/></g><g fill="white" stroke-width="2"><rect x="34" y="239" width="252" height="115" rx="11" stroke="#245edb"/><rect x="314" y="239" width="252" height="115" rx="11" stroke="#007e95"/><rect x="594" y="239" width="252" height="115" rx="11" stroke="#7547bc"/></g><g font-size="21" text-anchor="middle" font-weight="650"><text x="160" y="270" fill="#245edb">Selective records</text><text x="440" y="270" fill="#007e95">Trace entropy</text><text x="720" y="270" fill="#7547bc">Quantum channels</text></g><g text-anchor="middle" font-size="18" fill="#35506e"><text x="160" y="304">Born weights and</text><text x="160" y="330">causal agreement</text><text x="440" y="304">Semifinite split;</text><text x="440" y="330">conditional gravity</text><text x="720" y="304">Pullback bounds;</text><text x="720" y="330">causal linearity tests</text></g><text x="440" y="382" text-anchor="middle" font-size="17" fill="#4e6583">Mathematical constructions, not a derived microscopic gravitational theory</text></svg>
